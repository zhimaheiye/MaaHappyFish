name: Bug Report (in English)
description: >-
  Recognition errors, operation abnormalities,
  connection errors, etc.
labels: ["bug"]
body:
  - type: checkboxes
    id: checks
    attributes:
      label: Before raising the issue...
      description: |
        Please ensure that you have completed the requirements before checking the box.
      options:
        - label: >-
            I understand that Issues are for feedback and problem solving,
            not trolling the comments section, and will provide as
            much information as possible to help solve the problem.
          required: true
        - label: >-
            I filled in a short, clear title
            so that developers could quickly identify the general problem
            when going through the issue list.
            Instead of "Some suggestions", "Stuck", etc.
          required: true
        - label: >-
            I am using the latest version of the current update and have reviewed
            both the updates released so far and the unreleased changes in the Pull Requests,
            there is no mention of the bug being fixed.
          required: true
        - label: >-
            I have reviewed the Pinned issue (Announcements), Open issues, and Closed issues
            to ensure that my issue has not been mentioned.
          required: true
  - type: textarea
    id: describe
    attributes:
      label: Description
      description: Please provide a detailed description of your issue.
    validations:
      required: true
  - type: textarea
    id: version
    attributes:
      label: Version
      description: >-
        Please provide the MaaHappyFish version.
      placeholder: |
        MaaHappyFish Version:
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Test report and logs
      description: |
        1. Note the approximate failure time, stop the task, and close MFAAvalonia.
        2. Double-click `collect-test-report.cmd` in the application directory. It saves the 3 most recent complete logs and a report form as a ZIP on your desktop.
        3. Upload the complete ZIP and enter the failure time and run duration below. If the collector cannot run, upload the complete matching files from `logs/log-*.log`.

        Issues and attachments in this repository are public. Review the ZIP before uploading it. The collector does not upload anything automatically or collect account configuration.
      placeholder: |
        Approximate failure time:
        Run duration:
        Drag the test report ZIP here
    validations:
      required: true
  - type: textarea
    id: configuration
    attributes:
      label: Configuration information
      description: |
        Please specify the operating system and version, emulator brand, emulator resolution, DPI, and frame rate;
        If you are using MuMu 12 or LDPlayer 9, please specify whether Screenshot Enhancement is enabled;
        Finally, please specify whether GPU accelerated inference is enabled, and if so, provide the GPU model.
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or recordings
      description: |
        If possible, provide both the MFAAvalonia window and the emulator screen showing the failure. For recognition problems, prefer an unobstructed original image captured by the emulator or ADB.

        The collector does not include screenshots or recordings. Upload them separately, or compress them if they are too large.

    validations:
      required: false
  - type: textarea
    id: others
    attributes:
      label: Anthing else?
      description: |
        Anything that will give us more insight into the problem you are having.
    validations:
      required: false
