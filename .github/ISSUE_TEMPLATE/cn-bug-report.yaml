name: Bug 反馈（使用中文）
description: 识别错误、操作异常、连接错误等
labels: ["bug"]
body:
  - type: checkboxes
    id: checks
    attributes:
      label: 在提问之前...
      description: |
        请确认自己完成了要求之后再进行勾选
      options:
        - label: 我理解 Issue 是用于反馈和解决问题的，而非吐槽评论区，将尽可能提供更多信息帮助问题解决
          required: true
        - label: 我填写了简短且清晰明确的标题，以便开发者在翻阅 Issue 列表时能快速确定大致问题。而不是“一个建议”、“卡住了”等
          required: true
        - label: 我使用的是当前更新版本的最新版，且已查看版本发布至今和 Pull Requests 中尚未发布的更新内容，并未提及该 Bug 已被修复的情况
          required: true
        - label: 我已检查了置顶议题（Pinned Issue）（公告）、活跃议题（Open Issue）、已关闭议题（Closed Issue），确认我的问题未被提及
          required: true
  - type: textarea
    id: describe
    attributes:
      label: 问题描述
      description: 描述问题时请尽可能详细
    validations:
      required: true
  - type: textarea
    id: version
    attributes:
      label: Version
      description: >-
        请提供 MaaHappyFish 版本
      placeholder: |
        MaaHappyFish Version:
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 测试报告和日志
      description: |
        1. 先记录问题发生的大致时间，然后停止任务并关闭 MFAAvalonia。
        2. 双击程序目录中的 `collect-test-report.cmd`。收集器会将最近 3 份完整日志和一份待填写的测试信息保存为桌面上的 ZIP。
        3. 上传完整 ZIP，并在本栏填写问题时间和运行时长；若无法运行收集器，请上传 `logs/log-*.log` 中与问题时间对应的完整日志。

        本仓库的 Issue 和附件公开可见，请在上传前检查 ZIP 中是否包含不希望公开的信息。收集器不会自动上传文件，也不会收集账号配置。
      placeholder: |
        问题发生的大致时间：
        运行持续时间：
        请将测试报告 ZIP 拖到此处
    validations:
      required: true
  - type: textarea
    id: configuration
    attributes:
      label: 配置信息
      description: |
        请说明操作系统及版本、模拟器品牌、模拟器分辨率、DPI、帧率；
        若正在使用 MuMu 12 或雷电 9，请说明截图增强是否开启；
        最后请说明 GPU 加速推理是否开启，若开启请提供 GPU 型号。
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: 截图或录屏
      description: |
        请尽量同时提供 MFAAvalonia 运行界面和模拟器出错画面。若是识别相关问题，请优先提供模拟器自带截图工具或 ADB 截取的无遮挡原图。

        收集器不会自动打包截图或录屏，请单独上传；文件体积过大时可以压缩后再上传。
    validations:
      required: false
  - type: textarea
    id: others
    attributes:
      label: 还有别的吗？
      description: |
        任何能让我们对你所遇到的问题有更多了解的东西
    validations:
      required: false
